name: Profili Yenile

# Kartlar, katkı kilimi ve yılan her gece yeniden dokunur; sonuçlar `output` dalına yayınlanır.
on:
  schedule:
    - cron: "5 21 * * *" # 00:05 İstanbul (UTC+3)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profil
  cancel-in-progress: false

jobs:
  yenile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Günün atasözü
        run: |
          python scripts/atasozu.py
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || { git commit -m "📜 Günün atasözü güncellendi" && git push; }

      - name: Profil kartları (istatistik, dil dokuması, katkı kilimi, depo)
        env:
          # İsteğe bağlı: özel katkıları da saymak için PROFIL_TOKEN adında bir PAT ekleyebilirsin.
          GH_TOKEN: ${{ secrets.PROFIL_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/profil.py --kullanici "${{ github.repository_owner }}" --cikti dist

      - name: Katkı yılanı
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#D4AF37&color_dots=#16233D,#6B1D26,#A4161A,#E0412F,#F2B541

      - name: output dalına yayınla
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
