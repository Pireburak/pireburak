<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="pireburak@kali: cat /etc/turkiye">
  <title>pireburak@kali: cat /etc/turkiye</title>
  <defs>
    <!-- bayrak üzerinde kayan ışık/gölge: dalgalanma hissi -->
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox" spreadMethod="repeat">
      <stop offset="0" stop-color="#000" stop-opacity="0.22"/>
      <stop offset="0.25" stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#000" stop-opacity="0.22"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.22"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="0.5 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="flagClip"><rect width="300" height="200" rx="4"/></clipPath>
    <style>
      .t   { font-family: 'Share Tech Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace; font-size: 14px; fill: #d0d0d0; }
      .g   { fill: #00ff00; }
      .r   { fill: #ff4d57; }
      .dim { fill: #7d8590; }
      .ln  { opacity: 0; animation: show .01s forwards; }
      .l1 { animation-delay: .3s }  .l2 { animation-delay: .9s }  .l3 { animation-delay: 1.3s }
      .l4 { animation-delay: 1.7s } .l5 { animation-delay: 2.1s } .l6 { animation-delay: 2.5s }
      .l7 { animation-delay: 2.9s } .l8 { animation-delay: 3.3s } .l9 { animation-delay: 3.8s }
      .cur { animation: blink 1s steps(1) infinite; }
      @keyframes show  { to { opacity: 1 } }
      @keyframes blink { 50% { opacity: 0 } }
    </style>
  </defs>

  <!-- terminal penceresi -->
  <rect x="1" y="1" width="898" height="288" rx="12" fill="#0D1117" stroke="#00ff00" stroke-opacity=".35"/>
  <rect x="1" y="1" width="898" height="30" rx="12" fill="#161b22"/>
  <rect x="1" y="20" width="898" height="11" fill="#161b22"/>
  <circle cx="22" cy="16" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="16" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="16" r="6" fill="#27c93f"/>
  <text x="450" y="21" text-anchor="middle" class="t dim" style="font-size:12px">pireburak@kali: ~/turkiye</text>

  <!-- ay yıldız: resmi Türk Bayrağı Kanunu oranları (G = 200) -->
  <g transform="translate(40 58)">
    <rect x="-8" y="-6" width="4" height="226" rx="2" fill="#8b949e"/>
    <g filter="url(#glow)" clip-path="url(#flagClip)">
      <rect width="300" height="200" fill="#E30A17"/>
      <circle cx="100" cy="100" r="50" fill="#fff"/>
      <circle cx="112.5" cy="100" r="40" fill="#E30A17"/>
      <polygon fill="#fff" points="145.83,100.00 163.10,94.39 163.10,76.22 173.78,90.92 191.06,85.31 180.38,100.00 191.06,114.69 173.78,109.08 163.10,123.78 163.10,105.61"/>
      <rect width="300" height="200" fill="url(#wave)"/>
      <animateTransform attributeName="transform" type="skewY" values="0;1.2;0;-1.2;0" dur="4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- terminal çıktısı -->
  <g class="t">
    <text x="380" y="68"  class="ln l1"><tspan class="g">pireburak@kali</tspan><tspan class="dim">:</tspan><tspan fill="#58a6ff">~/turkiye</tspan><tspan class="dim">$</tspan> cat /etc/turkiye</text>
    <text x="380" y="98"  class="ln l2"><tspan class="g">[+]</tspan> ülke<tspan x="520" class="dim">:</tspan> Türkiye <tspan class="r">(TR)</tspan></text>
    <text x="380" y="120" class="ln l3"><tspan class="g">[+]</tspan> başkent<tspan x="520" class="dim">:</tspan> Ankara</text>
    <text x="380" y="142" class="ln l4"><tspan class="g">[+]</tspan> saat dilimi<tspan x="520" class="dim">:</tspan> UTC+03:00 · Europe/Istanbul</text>
    <text x="380" y="164" class="ln l5"><tspan class="g">[+]</tspan> yakıt<tspan x="520" class="dim">:</tspan> demli çay, ince belli bardakta</text>
    <text x="380" y="186" class="ln l6"><tspan class="g">[+]</tspan> klavye<tspan x="520" class="dim">:</tspan> Türkçe Q · ğ ü ş ı ö ç</text>
    <text x="380" y="216" class="ln l7"><tspan class="r">&gt;</tspan> "Hayatta en hakiki mürşit ilimdir."</text>
    <text x="380" y="238" class="ln l8"><tspan x="560" class="dim">— Mustafa Kemal Atatürk</tspan></text>
    <text x="380" y="266" class="ln l9"><tspan class="g">pireburak@kali</tspan><tspan class="dim">:</tspan><tspan fill="#58a6ff">~/turkiye</tspan><tspan class="dim">$</tspan> <tspan class="g cur">█</tspan></text>
  </g>
</svg>
